name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# 최소 권한 원칙
permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [20, 22]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Build
        run: pnpm run build

      - name: Test with coverage
        run: pnpm run test:coverage

      - name: Smoke test CLI
        run: |
          pnpm link --global
          tp-cli help
          tp-cli list
          tp-cli add testdir
          tp-cli list
          tp-cli del testdir
          tp-cli list
